<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">카메라 preview streaming 경로</title><desc id="desc">15개 capture host의 camera daemon이 preview broadcast를 내보내고, 전체 view viewer가 구독해 화면 grid를 갱신하는 경로.</desc><rect width="1200" height="900" fill="#f6f5ef"/><text x="80" y="105" fill="#17221f" font-family="system-ui, sans-serif" font-size="43" font-weight="700">전체 view streaming 경로</text><text x="80" y="151" fill="#62716b" font-family="system-ui, sans-serif" font-size="25">설정 해석과 viewer 구독은 정상. 프레임 생산은 capture PC daemon에 의존한다.</text><g font-family="system-ui, sans-serif"><rect x="80" y="260" width="270" height="310" rx="14" fill="#fffefa" stroke="#d9ddd5" stroke-width="3"/><text x="115" y="330" fill="#006c4f" font-size="30" font-weight="700">관측 설정</text><text x="115" y="385" fill="#17221f" font-size="25">capture host 15개</text><text x="115" y="425" fill="#17221f" font-size="25">카메라 48대</text><text x="115" y="485" fill="#62716b" font-size="21">pose 38</text><text x="115" y="520" fill="#62716b" font-size="21">object/stereo 10</text><path d="M385 415H505" fill="none" stroke="#006c4f" stroke-width="8"/><path d="M485 394l38 21-38 21" fill="#006c4f"/><rect x="535" y="260" width="280" height="310" rx="14" fill="#e7f4e1" stroke="#006c4f" stroke-width="3"/><text x="570" y="330" fill="#006c4f" font-size="30" font-weight="700">camera daemon</text><text x="570" y="385" fill="#17221f" font-size="25">명령 수신</text><text x="570" y="425" fill="#17221f" font-size="25">preview broadcast</text><text x="570" y="495" fill="#62716b" font-size="21">각 capture PC에서</text><text x="570" y="528" fill="#62716b" font-size="21">실행돼야 함</text><path d="M850 415H970" fill="none" stroke="#006c4f" stroke-width="8"/><path d="M950 394l38 21-38 21" fill="#006c4f"/><rect x="1000" y="260" width="120" height="310" rx="14" fill="#fff0df" stroke="#ef8c4c" stroke-width="3"/><text x="1025" y="330" fill="#8e4f10" font-size="26" font-weight="700">전체</text><text x="1025" y="365" fill="#8e4f10" font-size="26" font-weight="700">view</text><text x="1025" y="415" fill="#17221f" font-size="24">grid</text><text x="1025" y="485" fill="#62716b" font-size="19">JPEG</text><text x="1025" y="514" fill="#62716b" font-size="19">frame</text></g><line x1="80" y1="675" x2="1120" y2="675" stroke="#d9ddd5" stroke-width="3"/><text x="80" y="745" fill="#bd3e35" font-family="system-ui, sans-serif" font-size="30" font-weight="700">이번 장애 지점</text><text x="80" y="798" fill="#17221f" font-family="system-ui, sans-serif" font-size="27">capture PC daemon이 응답하지 않아 preview broadcast가 시작되지 않았다.</text></svg>
