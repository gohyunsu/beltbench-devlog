<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">카메라 preview 진단 결과</title><desc id="desc">capture host 15개와 카메라 48대가 설정에 등록돼 있고, 6개 preview 시작 성공과 20개 최신 frame 수신을 확인한 결과.</desc><rect width="1200" height="900" fill="#f6f5ef"/><g font-family="system-ui, sans-serif"><text x="80" y="105" fill="#17221f" font-size="43" font-weight="700">preview 진단 결과</text><text x="80" y="151" fill="#62716b" font-size="25">공개 기록용 익명화 결과. 주소, host명, 장치 식별자는 제외했다.</text><rect x="80" y="240" width="1040" height="120" rx="12" fill="#fffefa" stroke="#d9ddd5" stroke-width="3"/><text x="120" y="292" fill="#62716b" font-size="23">설정에서 확인한 관측 규모</text><text x="120" y="335" fill="#17221f" font-size="39" font-weight="700">capture host 15개  ·  카메라 48대</text><rect x="80" y="400" width="1040" height="120" rx="12" fill="#fff0df" stroke="#ef8c4c" stroke-width="3"/><text x="120" y="452" fill="#8e4f10" font-size="23">preview 시작 요청</text><text x="120" y="495" fill="#bd3e35" font-size="39" font-weight="700">성공 6 / 15</text><rect x="80" y="560" width="1040" height="120" rx="12" fill="#f9dfdd" stroke="#bd3e35" stroke-width="3"/><text x="120" y="612" fill="#8c302b" font-size="23">viewer가 수신한 최신 frame</text><text x="120" y="655" fill="#bd3e35" font-size="39" font-weight="700">frame cache 20</text><line x1="80" y1="760" x2="1120" y2="760" stroke="#d9ddd5" stroke-width="3"/><text x="80" y="820" fill="#17221f" font-size="27">판단: viewer와 6개 capture daemon의 frame 경로는 복구됐다. 남은 host와 누락 카메라를 복구한다.</text></g></svg>
