<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title">
<title id="title">Camera intrinsic, extrinsic, and hand-eye calibration</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78b7ff"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e8eef8}.b{fill:#15243a;stroke:#78b7ff;stroke-width:2}.n{font-size:25px;font-weight:700}.s{font-size:18px;fill:#b8c8df}</style></defs><rect width="1200" height="480" fill="#0c1422"/><text x="55" y="55" class="n">한 pixel을 robot 행동으로 바꾸려면 세 가지 좌표 관계가 필요하다</text>
<g transform="translate(70 130)"><rect class="b" width="285" height="165" rx="18"/><text x="25" y="46" class="n">Intrinsic</text><text x="25" y="78" class="s">카메라 내부의 렌즈 모델</text><text x="25" y="108" class="s">focal length · principal point</text><text x="25" y="138" class="s">lens distortion</text></g>
<g transform="translate(458 130)"><rect class="b" width="285" height="165" rx="18"/><text x="25" y="46" class="n">Extrinsic</text><text x="25" y="78" class="s">camera ↔ 작업대/base</text><text x="25" y="108" class="s">위치 + 방향</text><text x="25" y="138" class="s">mount가 바뀌면 새로 측정</text></g>
<g transform="translate(846 130)"><rect class="b" width="285" height="165" rx="18"/><text x="25" y="46" class="n">Hand-eye</text><text x="25" y="78" class="s">tool ↔ board/camera</text><text x="25" y="108" class="s">robot pose와 vision을 연결</text><text x="25" y="138" class="s">여러 자세로 함께 계산</text></g>
<path d="M355 212H458 M743 212H846" stroke="#78b7ff" stroke-width="4" marker-end="url(#a)"/><text x="150" y="365" class="s">pixel</text><path d="M210 350H980" stroke="#6ee7b7" stroke-width="4" marker-end="url(#a)"/><text x="474" y="405" class="n">작업대 기준 3D 위치 → xArm 목표 pose</text></svg>
