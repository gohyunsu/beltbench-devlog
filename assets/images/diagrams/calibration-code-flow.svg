<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title">
<title id="title">BeltBench calibration code flow</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78b7ff"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e8eef8}.b{fill:#15243a;stroke:#78b7ff;stroke-width:2}.n{font-size:22px;font-weight:700}.s{font-size:16px;fill:#b8c8df}</style></defs><rect width="1200" height="520" fill="#0c1422"/><text x="50" y="52" class="n">BeltBench calibration: transport adapter는 얇게, 수학 solver는 독립적으로</text>
<g transform="translate(55 105)"><rect class="b" width="250" height="125" rx="16"/><text x="22" y="40" class="n">capture.py</text><text x="22" y="70" class="s">Robot.move_joints()</text><text x="22" y="96" class="s">Frames.read()</text></g><g transform="translate(365 105)"><rect class="b" width="250" height="125" rx="16"/><text x="22" y="40" class="n">charuco.py</text><text x="22" y="70" class="s">corner detection</text><text x="22" y="96" class="s">solvePnP → camera_to_board</text></g><g transform="translate(675 105)"><rect class="b" width="250" height="125" rx="16"/><text x="22" y="40" class="n">session.py</text><text x="22" y="70" class="s">portable JSON session</text><text x="22" y="96" class="s">camera별 sample grouping</text></g><g transform="translate(985 105)"><rect class="b" width="160" height="125" rx="16"/><text x="20" y="40" class="n">CLI</text><text x="20" y="70" class="s">JSON result</text><text x="20" y="96" class="s">RMS report</text></g>
<path d="M305 168H365 M615 168H675 M925 168H985" stroke="#78b7ff" stroke-width="4" marker-end="url(#a)"/>
<g transform="translate(330 330)"><rect class="b" width="540" height="130" rx="16"/><text x="24" y="40" class="n">handeye.py + geometry.py</text><text x="24" y="70" class="s">pairwise relative motions → AX = XB → least_squares(soft_l1)</text><text x="24" y="100" class="s">candidate extrinsics → SVD average → translation / rotation RMS</text></g><path d="M800 230V330" stroke="#6ee7b7" stroke-width="4" marker-end="url(#a)"/></svg>
