<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title">
<title id="title">Separate and joint calibration comparison</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78b7ff"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e8eef8}.b{fill:#15243a;stroke:#78b7ff;stroke-width:2}.n{font-size:23px;font-weight:700}.s{font-size:16px;fill:#b8c8df}.h{font-size:28px;font-weight:700}</style></defs><rect width="1200" height="520" fill="#0c1422"/><text x="55" y="54" class="h">두 calibration은 “같은 값”이 아니라 “같은 capture로 함께 풀 수 있는 두 값”이다</text>
<g transform="translate(55 105)"><rect class="b" width="470" height="330" rx="18"/><text x="24" y="42" class="n">기존 분리 흐름</text><text x="24" y="88" class="s">A. 사람이 board를 움직여 multi-camera</text><text x="24" y="114" class="s">   extrinsic을 별도 추정</text><text x="24" y="163" class="s">B. robot이 pre-made trajectory로 움직여</text><text x="24" y="189" class="s">   hand-eye를 별도 추정</text><text x="24" y="245" class="s">장점: 기존 multi-camera reconstruction 재사용</text><text x="24" y="276" class="s">단점: 두 capture, 두 storage/solver 경로</text></g>
<g transform="translate(675 105)"><rect class="b" width="470" height="330" rx="18"/><text x="24" y="42" class="n">BeltBench 통합 흐름</text><text x="24" y="88" class="s">board를 tool에 rigid mount</text><text x="24" y="140" class="s">robot의 안전 pose마다:</text><text x="42" y="166" class="s">base_to_tool + camera_to_board</text><text x="24" y="218" class="s">한 session에서:</text><text x="42" y="244" class="s">tool_to_board + base_to_camera</text><text x="24" y="294" class="s">camera별로 결측 view를 독립적으로 제외 가능</text></g>
<path d="M525 270H675" stroke="#6ee7b7" stroke-width="4" marker-end="url(#a)"/><text x="534" y="245" class="s">동일한</text><text x="534" y="267" class="s">물리 관측</text></svg>
