<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title">
<title id="title">Safe waypoint approval gates</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78b7ff"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e8eef8}.b{fill:#15243a;stroke:#78b7ff;stroke-width:2}.n{font-size:22px;font-weight:700}.s{font-size:16px;fill:#b8c8df}</style></defs><rect width="1200" height="460" fill="#0c1422"/><text x="55" y="54" class="n">자동 capture는 waypoint 파일이 아니라, 승인된 safety gate의 결과여야 한다</text>
<g transform="translate(55 120)"><rect class="b" width="190" height="150" rx="16"/><text x="20" y="42" class="n">1. Geometry</text><text x="20" y="75" class="s">hand + board</text><text x="20" y="100" class="s">table + camera</text><text x="20" y="125" class="s">충돌 여유</text></g><g transform="translate(290 120)"><rect class="b" width="190" height="150" rx="16"/><text x="20" y="42" class="n">2. Motion</text><text x="20" y="75" class="s">joint limits</text><text x="20" y="100" class="s">slow speed</text><text x="20" y="125" class="s">approved path</text></g><g transform="translate(525 120)"><rect class="b" width="190" height="150" rx="16"/><text x="20" y="42" class="n">3. Visibility</text><text x="20" y="75" class="s">board size</text><text x="20" y="100" class="s">corner count</text><text x="20" y="125" class="s">rotation diversity</text></g><g transform="translate(760 120)"><rect class="b" width="190" height="150" rx="16"/><text x="20" y="42" class="n">4. Stability</text><text x="20" y="75" class="s">arrival confirmed</text><text x="20" y="100" class="s">settle dwell</text><text x="20" y="125" class="s">timestamp check</text></g><g transform="translate(995 120)"><rect class="b" width="150" height="150" rx="16"/><text x="20" y="42" class="n">5. Capture</text><text x="20" y="75" class="s">frame + pose</text><text x="20" y="100" class="s">residual</text><text x="20" y="125" class="s">accept/reject</text></g>
<path d="M245 195H290 M480 195H525 M715 195H760 M950 195H995" stroke="#78b7ff" stroke-width="4" marker-end="url(#a)"/><text x="160" y="350" class="s">기존 trajectory 파일은 2번의 출발점일 수 있지만, 1·3·4의 현재 환경 검증을 대체하지 않는다.</text></svg>
