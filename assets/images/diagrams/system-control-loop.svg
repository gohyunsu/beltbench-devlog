<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">BeltBench closed-loop manipulation</title><desc id="desc">Cameras observe an object; a perception and planning layer chooses a grasp; xArm and hand execute; cameras and hand state provide feedback.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#78b7ff"/></marker><style>text{font-family:system-ui,sans-serif;fill:#e8eef8}.box{fill:#15243a;stroke:#78b7ff;stroke-width:2}.minor{font-size:19px;fill:#b8c8df}.head{font-size:26px;font-weight:700}</style></defs>
<rect width="1200" height="420" fill="#0c1422"/><text x="60" y="58" class="head">BeltBench: 관측 → 판단 → 실행 → 피드백</text>
<g transform="translate(60 120)"><rect class="box" width="210" height="130" rx="18"/><text x="24" y="48" class="head">1. 카메라</text><text x="24" y="80" class="minor">pixel · timestamp</text><text x="24" y="108" class="minor">물체와 작업대 관측</text></g>
<g transform="translate(350 120)"><rect class="box" width="220" height="130" rx="18"/><text x="24" y="48" class="head">2. 지각·계획</text><text x="24" y="80" class="minor">3D pose · grasp 후보</text><text x="24" y="108" class="minor">안전한 행동 선택</text></g>
<g transform="translate(650 120)"><rect class="box" width="220" height="130" rx="18"/><text x="24" y="48" class="head">3. xArm</text><text x="24" y="80" class="minor">목표 pose → 관절 운동</text><text x="24" y="108" class="minor">controller가 추종</text></g>
<g transform="translate(950 120)"><rect class="box" width="190" height="130" rx="18"/><text x="24" y="48" class="head">4. Hand</text><text x="24" y="80" class="minor">목표 관절값</text><text x="24" y="108" class="minor">grasp · 상태 반환</text></g>
<path d="M270 185H350 M570 185H650 M870 185H950" stroke="#78b7ff" stroke-width="4" marker-end="url(#a)"/>
<path d="M1045 250 C1020 355 245 355 165 250" fill="none" stroke="#6ee7b7" stroke-width="4" marker-end="url(#a)"/><text x="465" y="365" class="minor">새 영상 + hand 상태 + 성공/실패 → 다음 판단에 반영</text>
</svg>
