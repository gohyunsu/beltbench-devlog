<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">PC에서 Inspire hand까지의 제어 계층</title><desc id="desc">PC의 정책부터 Ethernet, IP routing, TCP Modbus, hand register와 관절 움직임까지 이어지는 다섯 계층과 각 계층의 검사 방법.</desc>
  <style>.bg{fill:#fffefa}.card{fill:#f4f7ee;stroke:#cad7ca;stroke-width:2}.ok{fill:#e3f1df;stroke:#6b9c6f;stroke-width:2}.wait{fill:#fff0df;stroke:#e08a44;stroke-width:2}.t{font:700 24px system-ui,sans-serif;fill:#17221f}.s{font:400 17px system-ui,sans-serif;fill:#50625a}.tiny{font:600 15px system-ui,sans-serif;fill:#50625a}.num{font:800 20px system-ui,sans-serif;fill:#006c4f}.line{stroke:#668077;stroke-width:4;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8" fill="#668077"/></marker></defs><rect class="bg" width="1200" height="670" rx="26"/>
  <text x="56" y="65" class="t" font-size="32">Inspire hand 제어는 다섯 계층을 차례로 통과한다</text><text x="56" y="98" class="s">앞 단계의 성공은 다음 단계를 보장하지 않는다. 현재 병목은 네 번째 단계다.</text>
  <path class="line" d="M225 203H300"/><path class="line" d="M450 203H525"/><path class="line" d="M675 203H750"/><path class="line" d="M900 203H975"/>
  <rect class="card" x="55" y="145" width="170" height="120" rx="16"/><text x="78" y="183" class="num">1 · PC / Policy</text><text x="78" y="215" class="t">명령 결정</text><text x="78" y="244" class="tiny">open? close?</text>
  <rect class="ok" x="300" y="145" width="150" height="120" rx="16"/><text x="322" y="183" class="num">2 · Link</text><text x="322" y="215" class="t">Ethernet</text><text x="322" y="244" class="tiny">carrier · cable</text>
  <rect class="ok" x="525" y="145" width="150" height="120" rx="16"/><text x="547" y="183" class="num">3 · Network</text><text x="547" y="215" class="t">IP route</text><text x="547" y="244" class="tiny">ARP · ping</text>
  <rect class="wait" x="750" y="145" width="150" height="120" rx="16"/><text x="772" y="183" class="num">4 · Service</text><text x="772" y="215" class="t">TCP / Modbus</text><text x="772" y="244" class="tiny">connect · request</text>
  <rect class="card" x="975" y="145" width="170" height="120" rx="16"/><text x="997" y="183" class="num">5 · Hand</text><text x="997" y="215" class="t">Register → motion</text><text x="997" y="244" class="tiny">angle · force · error</text>
  <rect class="card" x="55" y="343" width="1090" height="260" rx="20"/><text x="90" y="390" class="t">안전한 control sequence</text><circle cx="120" cy="462" r="28" fill="#006c4f"/><text x="111" y="470" fill="white" font-family="system-ui" font-weight="800" font-size="22">A</text><text x="164" y="453" class="t">status read</text><text x="164" y="480" class="s">현재 관절 위치·힘·오류·상태를 읽는다. 움직이지 않는다.</text><path class="line" d="M450 462H525"/><circle cx="565" cy="462" r="28" fill="#006c4f"/><text x="556" y="470" fill="white" font-family="system-ui" font-weight="800" font-size="22">B</text><text x="609" y="453" class="t">human check</text><text x="609" y="480" class="s">오류 없음, workspace 비어 있음, 방향 확인.</text><path class="line" d="M893 462H968"/><circle cx="1008" cy="462" r="28" fill="#006c4f"/><text x="999" y="470" fill="white" font-family="system-ui" font-weight="800" font-size="22">C</text><text x="1052" y="453" class="t">one write</text><text x="1052" y="480" class="s">확인 후에만</text><text x="1052" y="505" class="s">단일 목표값 전송.</text><text x="90" y="565" class="tiny">현재: A 이전의 TCP 연결 단계에서 응답이 없어 B와 C를 수행하지 않음.</text>
</svg>
