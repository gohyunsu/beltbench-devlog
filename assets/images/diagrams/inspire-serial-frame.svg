<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title">
<title id="title">RH56 serial status request and response</title><defs><style>text{font-family:system-ui,sans-serif;fill:#e8eef8}.b{fill:#15243a;stroke:#78b7ff;stroke-width:2}.n{font-size:24px;font-weight:700}.s{font-size:17px;fill:#b8c8df}</style></defs><rect width="1200" height="390" fill="#0c1422"/><text x="55" y="55" class="n">RH56 status read: 바이트를 보내고, frame 전체를 검증한다</text>
<text x="55" y="105" class="s">요청: 시작 표시 · hand ID · 길이 · READ 명령 · ANGLE_ACT 주소 · 읽을 바이트 수 · checksum</text>
<g transform="translate(55 130)"><rect class="b" width="120" height="65" rx="8"/><text x="20" y="38" class="n">Header</text></g><g transform="translate(185 130)"><rect class="b" width="110" height="65" rx="8"/><text x="30" y="38" class="n">ID</text></g><g transform="translate(305 130)"><rect class="b" width="130" height="65" rx="8"/><text x="24" y="38" class="n">READ</text></g><g transform="translate(445 130)"><rect class="b" width="210" height="65" rx="8"/><text x="24" y="38" class="n">Register</text></g><g transform="translate(665 130)"><rect class="b" width="170" height="65" rx="8"/><text x="24" y="38" class="n">Length</text></g><g transform="translate(845 130)"><rect class="b" width="190" height="65" rx="8"/><text x="24" y="38" class="n">Checksum</text></g>
<text x="55" y="265" class="s">응답: 같은 header / ID / 명령 / 주소를 확인하고 checksum을 다시 계산한다.</text><text x="55" y="300" class="s">그 뒤 payload 12 bytes를 여섯 개의 signed little-endian joint angle로 해석한다.</text><text x="55" y="350" class="n">한 byte라도 빠지거나 checksum이 다르면 “상태를 모른다”로 처리하고 motion을 보내지 않는다.</text></svg>
